name: Build Debug APK (manual)

# Manually triggered build that produces an installable, unsigned-for-testing
# debug APK - no signing secrets required. Use this after making changes
# (like the search widget) to get a file you can sideload onto a phone.
#
# To run it: open this repo on GitHub -> "Actions" tab -> "Build Debug APK
# (manual)" in the left sidebar -> "Run workflow" button.
# When it finishes, open the run and download the "kvaesitso-debug-apk" file
# under "Artifacts".

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDefaultDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kvaesitso-debug-apk
          path: app/app/build/outputs/apk/default/debug/app-default-debug.apk
