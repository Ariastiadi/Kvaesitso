name: Build Debug APK

# Builds a test APK automatically every time something is committed to
# the main branch (it can also be started by hand from the Actions tab).
# When the run turns green, open it and download "kvaesitso-debug-apk"
# under "Artifacts".

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDefaultDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kvaesitso-debug-apk
          path: app/app/build/outputs/apk/default/debug/app-default-debug.apk
